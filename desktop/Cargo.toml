[package]
name = "ponstamp-desktop"
version = "1.5.0"
description = "PonStamp（電子印メーカー）の窓・常駐・配布と更新"
edition = "2021"
rust-version = "1.90"
publish = false

# exe の名前は app/brand.json の exe と同じ（brand.rs の試験が食い違いを止める）
[[bin]]
name = "PonStamp"
path = "src/main.rs"

[features]
# 画面を exe に埋め込む本番の形。外すと Tauri の開発の形になる
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 窓に依らない処理（名前と版・保存・PNG・配布と更新・ショートカットの決まり）。道具（tools/）も同じ物を使う
ps_core = { package = "ps-core", path = "../core" }

# Windows の部品を直に呼ぶ（ショートカット・クリップボード・Windows 起動時の常駐・プロセスを待つ・探す・終わらせる）。版は Tauri が使っている物に合わせる
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
] }
