[package]
name = "ponstamp-desktop"
version = "1.1.0"
description = "PonStamp（電子印メーカー）の窓・常駐・配布と更新"
edition = "2021"
rust-version = "1.90"
publish = false

# 窓に依らない処理（保存・PNG・配布と更新・ショートカットの決まり）。試験からも使う
[lib]
name = "ps_core"
path = "src/lib.rs"

# exe の名前は app/brand.json の exe と同じ（brand.rs の試験が食い違いを止める）
[[bin]]
name = "PonStamp"
path = "src/main.rs"

[features]
# 画面を exe に埋め込む本番の形。外すと Tauri の開発の形になる
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 配る ZIP を展開する・指紋（SHA-256）を確かめる
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# クリップボードへ渡す絵（DIB）を作るため、PNG を画素に戻す
png = "0.18"

# Windows の部品を直に呼ぶ（ショートカット・クリップボード・Windows 起動時の常駐・プロセスを待つ）。版は Tauri が使っている物に合わせる
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_System_Registry",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
