# 窓（desktop/・Tauri）を Windows で本番の作り方（--release）で作り、本物の WebView2 で自己診断と更新の通しを流す（道具は cargo tools。Python は使わない）。
# 通った exe・配る ZIP（release.json・.sha256 つき）・自己診断の結果を Artifacts に置く。
# main に入ったとき（と手で動かしたとき）は、確かめ終えた配る ZIP を GitHub の Releases にも版の札（v<版>）で載せる（release）。
name: desktop

on:
  pull_request:
    paths: ["app/**", "core/**", "desktop/**", "tools/**", "Cargo.toml", "Cargo.lock", ".cargo/**", "README.md", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["app/**", "core/**", "desktop/**", "tools/**", "Cargo.toml", "Cargo.lock", ".cargo/**", "README.md", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      # exe が名乗る「作ったコミット」
      PONSTAMP_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: test（Rust・Windows）
        run: cargo test --locked --workspace
      - name: exe を作る
        run: cargo build --release --locked -p ponstamp-desktop
      # exe の名前は app/brand.json の 1 か所（ここには書かない）
      - name: exe の名前
        run: '"EXE=" + (Get-Content app/brand.json -Raw -Encoding utf8 | ConvertFrom-Json).exe | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'
      - name: 自己診断（本物の WebView2）
        run: |
          $env:PONSTAMP_LOCAL_ROOT = "$env:RUNNER_TEMP\root"
          $env:PONSTAMP_SELFTEST = "$env:RUNNER_TEMP\selftest.json"
          Start-Process -FilePath "target\release\$env:EXE" -WorkingDirectory $env:RUNNER_TEMP
          $deadline = (Get-Date).AddSeconds(180)
          while (-not (Test-Path $env:PONSTAMP_SELFTEST) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          Wait-Process -Name ([IO.Path]::GetFileNameWithoutExtension($env:EXE)) -Timeout 30 -ErrorAction SilentlyContinue
          Get-ChildItem "$env:PONSTAMP_LOCAL_ROOT\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 25 -Encoding utf8 }
          cargo tools selftest $env:PONSTAMP_SELFTEST
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: 更新の通し（本物の WebView2）
        run: cargo tools verify --exe "target\release\$env:EXE" --work "$env:RUNNER_TEMP\verify"
      - name: 配る ZIP を作る
        run: cargo tools build --exe "target\release\$env:EXE" --out "$env:RUNNER_TEMP\release"
      - name: 成果物をまとめる
        if: always()
        run: |
          $out = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force $out | Out-Null
          if (Test-Path "target\release\$env:EXE") { Copy-Item "target\release\$env:EXE" $out }
          if (Test-Path "$env:RUNNER_TEMP\selftest.json") { Copy-Item "$env:RUNNER_TEMP\selftest.json" $out }
          Get-ChildItem "$env:RUNNER_TEMP\release" -File -ErrorAction SilentlyContinue | Copy-Item -Destination $out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn

  # 確かめ終えた配る ZIP を GitHub の Releases に載せる（main だけ。PR では動かない）。説明はその版の更新履歴から作る（cargo tools notes）。
  # 書き込みの権限はこの job にだけ渡す。同じ版の札が既にあれば上書きしない（版を上げずに入った変更。配った ZIP と指紋を変えない）。
  release:
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: out
      - name: Releases に載せる
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo tools version)
          tag="v$version"
          built=$(jq -r .version out/release.json); zip=$(jq -r .zip out/release.json)
          if [ "$built" != "$version" ]; then echo "::error::作った ZIP の版（$built）と app/version.json の版（$version）が違います"; exit 1; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::$tag は既に Releases にあります（上書きしません）。配る物を変えたときは版を上げてください。"
            exit 0
          fi
          cargo tools notes --release out/release.json > notes.md
          gh release create "$tag" "out/$zip" "out/$zip.sha256" out/release.json \
            --target "$GITHUB_SHA" --title "版 $version" --notes-file notes.md --latest
