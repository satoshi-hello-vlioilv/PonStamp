# CLAUDE.md の「push 前の確かめ」を GitHub でも回す（型・構文・lint〔ruff・clippy〕・試験）。
# - tools: 画面と道具の JS の構文・Python の構文と lint・試験（道具は Python の標準の部品だけで動く）
# - desktop: 窓（Rust・Tauri）の書式・作成・試験と、本物の窓（WebKitGTK）での自己診断と更新の通し（Windows の WebView2 は desktop.yml）
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 型・構文（画面の JS・道具の JS）
        run: bash tools/js-check.sh   # import を使う .js はモジュールとして確かめる（CLAUDE.md と同じ）
      - name: 型・構文（Python）
        run: python -m compileall -q tools tests
      # 手元と同じ版の ruff（版が変わると決まりが増えて、手元で通った物が落ちる）
      - name: lint（Python・ruff）
        run: |
          pip install ruff==0.16.9
          ruff check tools tests
      - name: test（Python）
        run: python -m unittest discover -s tests -t .

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 窓を作る部品（WebKitGTK）と画面の無い X
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb
      # 手元と同じ版（clippy は版が上がると決まりが増え、手元で通った物が落ちる）。上げるときは手元と一緒に上げる
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: lint（Rust の書式）
        working-directory: desktop
        run: cargo fmt --check
      - name: typecheck（Rust）
        working-directory: desktop
        run: cargo build --locked
      - name: lint（Rust・clippy）
        working-directory: desktop
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test（Rust）
        working-directory: desktop
        run: cargo test --locked
      - name: 自己診断（本物の窓・WebKitGTK）
        run: |
          export PONSTAMP_LOCAL_ROOT="$RUNNER_TEMP/root" PONSTAMP_SELFTEST="$RUNNER_TEMP/selftest.json" PONSTAMP_AUTOSTART_DIR="$RUNNER_TEMP/autostart"
          timeout 180 xvfb-run -a desktop/target/debug/PonStamp || true
          python - <<'PY'
          import json, os, sys
          path = os.environ["PONSTAMP_SELFTEST"]
          if not os.path.exists(path):
              sys.exit("結果のファイルがありません")
          r = json.load(open(path, encoding="utf-8"))
          for x in r.get("results", []):
              print("PASS" if x["ok"] else "FAIL", x["name"], "--", x["info"])
          for s in r.get("saved", []):
              print("PASS" if s["ok"] else "FAIL", "保存した PNG の解像度", s["type"], s["fileDpi"])
          if r.get("error"):
              print("ERROR:", r["error"])
          sys.exit(0 if r.get("ok") else 1)
          PY
      # 更新の通し（tools/verify.py）: 共有から写る → 裏で取り込む → 次の起動で入れ替わる → 閉じている間に置いた版に 1 回の起動で入れ替わる →
      # 起動できない版は控えへ戻す → 配る版を戻す → 新しい PC が配る入口から入る
      - name: 更新の通し（本物の窓・WebKitGTK）
        run: xvfb-run -a python tools/verify.py --exe desktop/target/debug/PonStamp --work "$RUNNER_TEMP/verify"
      - name: 記録
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/root/logs/*.log || true
