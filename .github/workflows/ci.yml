# CLAUDE.md の「push 前の確かめ」を GitHub でも回す（型・構文・lint〔clippy〕・試験）。Python は使わない（道具は Rust の tools/・撮影と画面の評価関数は Node）。
# - tools: 画面と道具の JS の構文・窓に依らない部品（core）と道具（tools）の試験（WebKitGTK は要らない）・画面の評価関数（Node・Chromium）
# - desktop: ワークスペース全体（core・desktop・tools）の書式・作成・clippy・試験と、本物の窓（WebKitGTK）での自己診断と更新の通し
#   （Windows の WebView2 は desktop.yml）
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 手元と同じ版（上げるときは手元と一緒に上げる）
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: tools
      - name: 型・構文（画面の JS・道具の JS）
        run: bash tools/js-check.sh   # import を使う .js はモジュールとして確かめる（CLAUDE.md と同じ）
      - name: test（窓に依らない部品・道具。版の上げ忘れ・配る ZIP の形・採点の決め方）
        run: cargo test --locked -p ps-core -p ps-tools
      # 評価関数（画面の部品の動き。ものさし・使い方は本物の Chromium で押して確かめる）。Playwright は手元と同じ版
      - name: test（画面の評価関数・Node）
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node tools/presets-eval.mjs
          node tools/ruler-eval.mjs
          node tools/presets-flow-eval.mjs

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 窓を作る部品（WebKitGTK）と画面の無い X
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb
      # 手元と同じ版（clippy は版が上がると決まりが増え、手元で通った物が落ちる）。上げるときは手元と一緒に上げる
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: lint（Rust の書式）
        run: cargo fmt --all --check
      - name: typecheck（Rust）
        run: cargo build --locked --workspace
      - name: lint（Rust・clippy）
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test（Rust）
        run: cargo test --locked --workspace
      - name: 自己診断（本物の窓・WebKitGTK）
        run: |
          export PONSTAMP_LOCAL_ROOT="$RUNNER_TEMP/root" PONSTAMP_SELFTEST="$RUNNER_TEMP/selftest.json" PONSTAMP_AUTOSTART_DIR="$RUNNER_TEMP/autostart"
          timeout 180 xvfb-run -a target/debug/PonStamp || true
          cargo tools selftest "$PONSTAMP_SELFTEST"
      # 更新の通し（cargo tools verify）: 共有から写る → 裏で取り込む → 次の起動で入れ替わる → 閉じている間に置いた版に 1 回の起動で入れ替わる →
      # 起動できない版は控えへ戻す → 配る版を戻す → 新しい PC が配る入口から入る → 古い版が常駐していても新しい版の exe で代わる
      - name: 更新の通し（本物の窓・WebKitGTK）
        run: xvfb-run -a cargo tools verify --exe target/debug/PonStamp --work "$RUNNER_TEMP/verify"
      - name: 記録
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/root/logs/*.log || true
