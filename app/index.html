<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PonStamp — 電子印メーカー</title>
<link rel="icon" href="stamp.ico">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 形（2026-10 の改良で決めた G2「アプリの殻」）: 左の帯に登録した印・中に入力・右に印とコピー。設定は右上から引き出す。
     窓の高さにぴったり収め、頁ごとは送らない（入力の列が長いときは列の中だけ送る） -->
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">印</span>電子印メーカー</div>
  <button type="button" class="btn small" id="btnSettings" data-open="settings" title="保存先・解像度・常駐・更新・配布">設定</button>
</header>
<div class="shell">
  <aside class="rail" aria-label="登録した印">
    <h2 class="rail-h">登録した印</h2>
    <nav class="presets" id="presetBar" aria-label="登録した印（押すと呼び出す）"></nav>
    <button type="button" class="btn small" id="btnAddPreset" title="いま作っている印を登録します">＋ いまの印を登録</button>
    <p class="rail-tip"><b>通知領域からも使えます</b>右下の印のアイコンを右クリックして、登録した印を押すとそのままコピーされます。</p>
  </aside>
  <div class="work">
  <div class="notices" id="notices" hidden></div>
  <main class="layout">
<!-- 左：設定 -->
  <section class="panel" aria-label="印を作る">
    <div class="seg" role="tablist" aria-label="印の種類" id="typeTabs">
      <button type="button" role="tab" data-type="mitome">認印</button>
      <button type="button" role="tab" data-type="date">日付印</button>
      <button type="button" role="tab" data-type="square">角印</button>
    </div>

    <h3 class="grp">印の文字</h3>
    <div class="field" data-for="date">
      <label for="inDept">上段（部署・会社名）</label>
      <input id="inDept" class="big" type="text" data-key="dept" placeholder="例：総務課" autocomplete="off">
    </div>

    <div class="field" data-for="mitome date">
      <label for="inName">氏名</label>
      <input id="inName" class="big" type="text" data-key="name" placeholder="例：山田" autocomplete="off">
      <p class="hint" data-for="mitome">4文字以上は2列（右列から）で配置します</p>
    </div>

    <div class="field" data-for="date">
      <span class="lbl">日付</span>
      <div class="row">
        <label class="check nowrap"><input type="checkbox" data-key="dateAuto"> 常に今日</label>
        <input id="inDate" type="date" data-key="date" aria-label="日付を指定">
      </div>
      <div class="row mt">
        <select data-key="dateFmt" aria-label="日付の書式">
          <option value="y2">’26.10.26（西暦2桁）</option>
          <option value="y4">2026.10.26（西暦4桁）</option>
          <option value="r">R8.10.26（令和）</option>
          <option value="rn">8.10.26（令和・記号なし）</option>
        </select>
        <label class="check nowrap"><input type="checkbox" data-key="pad"> 0埋め</label>
      </div>
    </div>

    <div class="field" data-for="square">
      <label for="inSquare">印面の文字</label>
      <input id="inSquare" class="big" type="text" data-key="square" placeholder="例：株式会社見本之印" autocomplete="off">
      <div class="row mt">
        <span class="lbl nowrap">列数</span>
        <select data-key="sqCols" aria-label="列数">
          <option value="auto">自動</option>
          <option value="1">1列</option><option value="2">2列</option>
          <option value="3">3列</option><option value="4">4列</option><option value="5">5列</option>
        </select>
      </div>
    </div>

    <h3 class="grp">印の見た目</h3>
    <div class="field">
      <span class="lbl">色</span>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="field">
      <span class="lbl">大きさ（mm・印影の直径／一辺）</span>
      <div class="sizes" id="sizes"></div>
    </div>

    <details class="adv">
      <summary>詳細設定</summary>
      <div class="adv-body">
        <div class="field">
          <label for="inFont">書体</label>
          <select id="inFont" data-key="font"></select>
        </div>
        <div class="range"><label for="rgBorder">枠の太さ</label><input id="rgBorder" type="range" min="1.5" max="9" step="0.5" data-key="border"><output data-out="border"></output></div>
        <div class="range"><label for="rgBold">文字の太さ</label><input id="rgBold" type="range" min="0" max="10" step="1" data-key="bold"><output data-out="bold"></output></div>
        <div class="range"><label for="rgKasure">かすれ</label><input id="rgKasure" type="range" min="0" max="100" step="5" data-key="kasure"><output data-out="kasure"></output></div>
        <div class="range"><label for="rgTilt">傾き</label><input id="rgTilt" type="range" min="-15" max="15" step="1" data-key="tilt"><output data-out="tilt"></output></div>
        <div class="row">
          <button type="button" class="btn small" id="btnReseed">かすれ模様を変える</button>
          <button type="button" class="btn small" id="btnResetAdv">詳細を初期値に戻す</button>
        </div>
      </div>
    </details>
  </section>

  <!-- 右：プレビューと出力 -->
  <section class="preview" aria-label="プレビュー">
    <div class="stage checker" id="stage">
      <canvas id="pv" width="640" height="640" role="img" aria-label="印影のプレビュー"></canvas>
    </div>
    <div class="meta" id="meta"></div>
    <div class="bgrow">
      <span class="lbl">プレビューの地</span>
      <div class="bgtoggle" role="group" aria-label="プレビューの地">
        <button type="button" data-bg="checker">透明</button>
        <button type="button" data-bg="paper">白紙</button>
      </div>
      <span class="hint">書き出す PNG はいつも透明です</span>
    </div>
    <div class="actions">
      <button type="button" class="btn primary" id="btnCopy">コピー<kbd>Ctrl+Enter</kbd></button>
      <button type="button" class="btn" id="btnSave">PNG保存<kbd>Ctrl+S</kbd></button>
      <button type="button" class="btn" id="btnFolder">保存フォルダ</button>
    </div>
    <p class="hint center">コピーしたら、Excel・Word・PowerPoint・PDF 編集ソフトなどで Ctrl+V で貼り付けます</p>
  </section>
  </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlgPreset">
  <form method="dialog" class="dlg">
    <label for="inPresetName">登録名</label>
    <input id="inPresetName" type="text" maxlength="20" autocomplete="off" required>
    <div class="row end">
      <button type="submit" class="btn" value="cancel" formnovalidate>キャンセル</button>
      <button type="submit" class="btn primary small" value="ok">登録</button>
    </div>
  </form>
</dialog>

<dialog id="dlgSettings" class="settings-dlg" aria-labelledby="dlgSettingsTitle">
  <div class="dlg-head"><h1 id="dlgSettingsTitle">設定</h1><button type="button" class="btn small quiet" data-close aria-label="閉じる">閉じる</button></div>
  <div class="settings" id="settings"></div>
</dialog>

<dialog id="dlgHistory" aria-labelledby="dlgHistoryTitle">
  <div class="dlg-head"><h1 id="dlgHistoryTitle">更新履歴</h1><button type="button" class="btn small quiet" data-close aria-label="閉じる">閉じる</button></div>
  <div class="history" id="history"></div>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
